name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/harris1111/lasoviet-api:sha-${{ github.sha }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/harris1111/lasoviet-web:sha-${{ github.sha }}
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/harris1111/lasoviet-worker:sha-${{ github.sha }}
      - name: Build and push immutable release marker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/release-marker.Dockerfile
          build-args: |
            REVISION=${{ github.sha }}
          push: true
          tags: ghcr.io/harris1111/lasoviet-release:sha-${{ github.sha }}
      - name: Advance production release marker
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/harris1111/lasoviet-release:production \
            ghcr.io/harris1111/lasoviet-release:sha-${{ github.sha }}
