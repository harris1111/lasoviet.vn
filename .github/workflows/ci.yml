name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:check
      - run: pnpm build
      - run: pnpm test
      - name: Install browser for real-network funnel QA
        run: pnpm exec playwright install --with-deps chromium
      - name: Run inline top-up and contextual unlock component acceptance
        run: pnpm exec playwright test tests/e2e/inline-topup.spec.ts tests/e2e/contextual-unlock.spec.ts tests/e2e/pending-unlock.spec.ts tests/e2e/personal-daily-reading.spec.ts tests/e2e/personal-daily-purchase.spec.ts tests/e2e/report-notification.spec.ts tests/e2e/recovery-click-receipt.spec.ts --workers=2
      - name: Run isolated funnel paths and all eleven measurement events
        run: node scripts/run-funnel-golden-paths.mjs

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-release-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/harris1111/lasoviet-api:sha-${{ github.sha }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_SENTRY_CLIENT_ENABLED=${{ vars.SENTRY_CLIENT_ENABLED || 'false' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_CLIENT_DSN }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          push: true
          tags: ghcr.io/harris1111/lasoviet-web:sha-${{ github.sha }}
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/harris1111/lasoviet-worker:sha-${{ github.sha }}
      - name: Build and push immutable release marker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/release-marker.Dockerfile
          build-args: |
            REVISION=${{ github.sha }}
          push: true
          tags: ghcr.io/harris1111/lasoviet-release:sha-${{ github.sha }}

  promote-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-promotion-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Advance production release marker
        run: |
          current_master_sha="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          if [[ ! "$current_master_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid current master revision" >&2
            exit 1
          fi
          if [ "$current_master_sha" != "${{ github.sha }}" ]; then
            echo "Skip superseded release promotion"
            exit 0
          fi
          docker buildx imagetools create \
            --tag ghcr.io/harris1111/lasoviet-release:production \
            ghcr.io/harris1111/lasoviet-release:sha-${{ github.sha }}
