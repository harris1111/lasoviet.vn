name: lasoviet-mvp

x-json-logs: &json-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-env: &runtime-env
  env_file:
    - ${DEPLOY_ENV_FILE:?Set DEPLOY_ENV_FILE in the external deploy env}

services:
  postgres:
    image: postgres:17.8-bookworm
    restart: unless-stopped
    <<: *runtime-env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging: *json-logs

  redis:
    image: redis:8.4.0-bookworm
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging: *json-logs

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    <<: *runtime-env
    command: ["node", "node_modules/@lasoviet/database/dist/migrate-cli.js"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logs

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    <<: *runtime-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *json-logs

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    <<: *runtime-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/health/worker-health-cli.js"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *json-logs

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    profiles: ["pdf"]
    restart: unless-stopped
    <<: *runtime-env
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:-}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:-}
    volumes:
      - garage_metadata:/var/lib/garage/meta
      - garage_metadata_snapshots:/var/lib/garage/meta-snapshots
      - garage_data:/var/lib/garage/data
      - ./config/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    logging: *json-logs

  pdf-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    profiles: ["pdf"]
    restart: unless-stopped
    <<: *runtime-env
    environment:
      WORKER_QUEUES: pdf.render
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/health/worker-health-cli.js"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *json-logs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    <<: *runtime-env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *json-logs

volumes:
  postgres_data:
  redis_data:
  garage_metadata:
  garage_metadata_snapshots:
  garage_data:
