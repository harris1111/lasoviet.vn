metadata_dir = "/var/lib/garage/meta"
metadata_snapshots_dir = "/var/lib/garage/meta-snapshots"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1
metadata_fsync = true

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "lasoviet-private"
root_domain = ".s3.garage.internal"
