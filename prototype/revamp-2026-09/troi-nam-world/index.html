<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Trời Nam world — dev harness (Tasks 1–3)</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      html, body { margin: 0; height: 100%; background: #080706; color: #eae4d5; font-family: system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #panel {
        position: fixed; left: 12px; top: 12px; z-index: 1;
        background: rgb(8 7 6 / 0.82); border: 1px solid rgb(201 164 77 / 0.4);
        border-radius: 8px; padding: 12px 14px; font-size: 13px; width: 260px;
      }
      #panel h1 { font-size: 13px; margin: 0 0 8px; color: #f2dca0; }
      #panel label { display: block; margin-top: 8px; }
      #panel .row { display: flex; gap: 8px; margin-top: 8px; }
      #panel button {
        flex: 1; background: #1a140a; color: #eae4d5; border: 1px solid rgb(201 164 77 / 0.5);
        border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 12px;
      }
      #panel button:hover { border-color: #c9a44d; }
      #stats { margin-top: 8px; white-space: pre-wrap; font-size: 11px; color: #b8b0a0; }
      input[type="range"] { width: 100%; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="world-canvas"></canvas>
    </div>
    <div id="panel">
      <h1>Trời Nam world — dev harness</h1>
      <label>
        progress (p)
        <input id="progress" type="range" min="0" max="1" step="0.001" value="0" />
      </label>
      <div class="row">
        <button id="capture-0">p=0</button>
        <button id="capture-375">p=.375</button>
        <button id="capture-625">p=.625</button>
        <button id="capture-1">p=1</button>
      </div>
      <div class="row">
        <button id="toggle-active">Pause</button>
        <button id="reinit">Dispose + recreate</button>
      </div>
      <div class="row">
        <button id="toggle-chart-target">Chart target: fallback</button>
      </div>
      <div id="stats"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
