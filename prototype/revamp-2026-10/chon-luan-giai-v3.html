<title>Trang chọn luận giải v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Source+Serif+4:wght@500;600&display=swap">
<style>
/* Layout: gợi ý theo người ở trên, dải sản phẩm theo tầng thời gian, bảng so sánh, tấm xác nhận. Giá chỉ bằng Lá; tiền đồng chỉ hiện ở tấm xác nhận khi cần nạp. */
:root{--bg:#0f0d0a;--panel:#1c1813;--raised:#221d16;--line:#3a3227;--fg:#f3ecdd;--muted:#c9bea8;--subtle:#a89d88;--gold:#c9a44d;--gold-hi:#f2dca0;--gold-ink:#c9a44d;--son:#ce5b45;--ok:#8fbf8a;--on-gold:#1a1408;--shadow:0 12px 40px rgba(0,0,0,.45);--f1:"Source Serif 4",Georgia,serif;--f2:"Be Vietnam Pro",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f7f1e5;--panel:#fffdf7;--raised:#ffffff;--line:#d7cdbd;--fg:#1d1812;--muted:#4f4538;--subtle:#6b604f;--gold:#a8842f;--gold-hi:#755718;--gold-ink:#755718;--son:#b3402c;--ok:#3f7a3b;--on-gold:#fffdf7;--shadow:0 12px 40px rgba(60,40,10,.18);color-scheme:light}}
:root[data-theme="dark"]{--bg:#0f0d0a;--panel:#1c1813;--raised:#221d16;--line:#3a3227;--fg:#f3ecdd;--muted:#c9bea8;--subtle:#a89d88;--gold:#c9a44d;--gold-hi:#f2dca0;--gold-ink:#c9a44d;--son:#ce5b45;--ok:#8fbf8a;--on-gold:#1a1408;--shadow:0 12px 40px rgba(0,0,0,.45);color-scheme:dark}
:root[data-theme="light"]{--bg:#f7f1e5;--panel:#fffdf7;--raised:#ffffff;--line:#d7cdbd;--fg:#1d1812;--muted:#4f4538;--subtle:#6b604f;--gold:#a8842f;--gold-hi:#755718;--gold-ink:#755718;--son:#b3402c;--ok:#3f7a3b;--on-gold:#fffdf7;--shadow:0 12px 40px rgba(60,40,10,.18);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--f2);padding-inline:16px;padding-block:0 80px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f1);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font:600 11px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
.wrap{max-width:1100px;margin:0 auto}
.proto{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--subtle)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);font-weight:600}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;margin-inline:-16px;padding-inline:16px}
.bal{font:600 14px var(--fm);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.head{padding-block:28px 8px;display:grid;gap:8px;max-width:62ch}
.head h1{font-size:clamp(28px,5vw,40px);line-height:1.15}
.head p{color:var(--muted)}
.sec{margin-top:36px;display:grid;gap:14px}
.sec>h2{font-size:clamp(21px,3vw,26px)}
.sec>p.lede{color:var(--muted);max-width:62ch}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.card{position:relative;display:grid;gap:10px;align-content:start;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);cursor:pointer;transition:border-color .12s,background-color .12s,transform .12s}
.card:hover{border-color:var(--gold);background:var(--raised)}
.card:active{transform:scale(.995)}
.card.feat{border-color:var(--gold);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--gold) 14%,transparent),0 0 0 1px color-mix(in srgb,var(--gold) 55%,transparent)}
.flag{justify-self:start;font:600 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--on-gold);padding:3px 10px;border-radius:999px}
.card h3{font-size:21px;line-height:1.25}
.pitch{color:var(--muted);font-size:15px}
.learn{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.parts{font-size:13px;color:var(--subtle)}
.trial{font-size:15px;border-left:2px solid var(--gold);padding-left:12px;color:var(--fg)}
.trial small{display:block;font:600 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.chip[aria-pressed="true"]::before{content:"✓ "}
.buy{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.price{font:600 15px var(--fm);color:var(--gold-ink)}
.cta{min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);font-weight:600;display:inline-flex;gap:12px;align-items:center;justify-content:center;transition:filter .12s,transform .12s}
.cta:hover{filter:brightness(1.08)}.cta:active{transform:scale(.97)}
.cta .ar{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--on-gold) 18%,transparent);display:grid;place-items:center}
.cta.locked{background:transparent;color:var(--fg);border-style:dashed}
.cta.locked .ar{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.cta.busy{opacity:.7;pointer-events:none}
.why{font-size:12px;color:var(--son);width:100%}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tier{display:grid;gap:10px}
.tier>h3{font-size:18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tier>h3 small{font:500 13px var(--f2);color:var(--subtle)}
.free{font-size:14px;color:var(--muted);padding:10px 14px;border:1px dashed var(--line);border-radius:12px}
.note{padding:12px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:15px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 12px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink)}
.assure{display:grid;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:15px;color:var(--muted)}
.assure b{color:var(--fg)}
/* tấm */
.back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.sheet{position:fixed;z-index:60;inset:auto 0 0 0;max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:grid;gap:14px;align-content:start;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet h3{font-size:22px}
.x{min-height:44px;min-width:44px;border-radius:999px;border:1px solid var(--line);background:transparent}
.sum{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--raised);font-size:15px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .em{font-weight:600;color:var(--gold-ink)}
.pack{display:grid;gap:6px;padding:14px;border:1px solid var(--gold);border-radius:12px}
.final{font-size:13px;color:var(--subtle)}
.ok{display:grid;gap:8px;padding:14px;border:1px solid var(--ok);border-radius:12px;color:var(--fg)}
.link{background:none;border:0;color:var(--gold-ink);text-decoration:underline;min-height:44px}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .grid.two{grid-template-columns:repeat(2,1fr)}
  .sheet{inset:0 0 0 auto;width:480px;max-height:none;border-radius:0;border-width:0 0 0 1px;padding:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 {id:"double",tier:"Gói gộp",name:"Trọn đời kép",price:1500,gate:"gate",parts:"Tử Vi + Bát Tự",learn:["Tử Vi trọn đời","Bát Tự trọn đời","Phần đối chiếu hai hệ"],trial:"Hai hệ đọc cùng một người, để thấy chỗ chúng đồng ý và chỗ chúng khác.",A:"Hai hệ đọc trọn đời trong một gói.",B:"Tử Vi và Bát Tự đọc cùng một bạn, rồi đối chiếu."}
];
const TIERS=["Hôm nay","Tháng","Năm","Chặng 10 năm","Cung","Chủ đề","Hai người","Trọn đời","Gói gộp"];
const FREEDONE={"Hôm nay":"Đã đọc miễn phí: dòng ngày và cung bị chạm.","Tháng":"Đã đọc miễn phí: 12 ô tháng, có đánh dấu.","Năm":"Đã đọc miễn phí: cung lưu niên và tóm tắt năm.","Chặng 10 năm":"Đã đọc miễn phí: Đường đời 10 năm, có điểm.","Cung":"Đã đọc miễn phí: 12 điểm và 1 cung được tặng.","Chủ đề":"Đã đọc miễn phí: câu hỏi và cung liên quan."};
const avail=p=>S.rel==="full"||p.gate==="now";
const byId=id=>P.find(p=>p.id===id);

function featured(){
  const a=S.arr;let ids=[],intro="",note="";
  if(a==="year-long")ids=["year","decade"];
  else if(a==="year-end")ids=["pair","year27"];
  else if(a==="palace")ids=["palace","life"];
  else ids=["life"];
  ids=ids.filter(id=>avail(byId(id)));
  if((a==="year-long"||a==="year-end")&&!ids.length){ids=["life"];note="Trọn đời có phần chặng hiện tại và năm hiện tại ở dạng tóm tắt. Muốn đọc 12 tháng của năm thì có bản Vận hạn năm, chưa mở bán.";}
  return {ids,note};
}
function headText(){
  const A=S.w==="A";
  const m={
   "year-long":[A?"Chọn phần luận giải cho năm Bính Ngọ":"Năm Bính Ngọ của bạn đang chạy, đọc nó cho kỹ",A?"Năm Bính Ngọ rơi vào cung Quan Lộc của bạn, năm thứ 10 trong chặng 25–34 tuổi.":"Năm Bính Ngọ rơi vào cung Quan Lộc của bạn, và cũng là năm cuối của chặng 25–34 tuổi. Hai lớp ấy gặp nhau ở đây."],
   "year-end":[A?"Chọn phần luận giải cho năm nay và năm sau":"Năm nay sắp khép lại, năm sau đã ở phía trước",A?"Năm Bính Ngọ kéo dài đến 06/02/2027. Bạn có thể đọc năm nay, năm sau hoặc cả hai.":"Năm Bính Ngọ kéo dài đến 06/02/2027. Bạn có thể đọc năm nay, đọc năm sau, hoặc đọc cả hai một lượt."],
   "palace":[A?"Đọc cung Thiên Di của bạn":"Cung Thiên Di đang làm bạn thắc mắc",A?"Bạn vừa xem cung Thiên Di. Bài đọc trọn cung này nằm ở bên dưới.":"Bạn vừa dừng ở cung Thiên Di. Có thể đọc riêng cung này, hoặc đọc cả lá số để thấy nó nằm ở đâu."],
   "direct":[A?"Chọn phần luận giải":"Bạn muốn đọc phần nào của lá số?",A?"Mỗi phần dưới đây đọc riêng theo lá số của bạn.":"Mỗi phần dưới đây được viết riêng cho lá số của bạn, bắt đầu từ chỗ bạn quan tâm nhất."]}[S.arr];
  return m;
}
function cardHTML(p,feat,flag){
  const need=Math.max(0,p.price-S.bal);const lock=need>0;
  const chip=p.pick?`<div class="chips" role="group" aria-label="Chọn cung">${["Thiên Di","Tài Bạch","Phụ Mẫu","Tật Ách"].map(c=>`<button class="chip" data-pal="${c}" aria-pressed="${c===S.palace}">${c}</button>`).join("")}<button class="chip" data-pal="more">Cung khác…</button></div>`:"";
  return `<article class="card ${feat?"feat":""}" data-card="${p.id}">${flag?`<span class="flag">${flag}</span>`:""}<span class="eyebrow">${p.tier}</span><h3>${p.name}${p.pick?` · ${S.palace}`:""}</h3><p class="pitch">${p[S.w]}</p><ul class="learn">${p.learn.map(x=>`<li>${x}</li>`).join("")}</ul><p class="parts">${p.parts}</p><div class="trial"><small>Đọc thử từ lá số của bạn</small>${p.pick?`Cung ${S.palace} của bạn ${S.palace==="Thiên Di"?"chỉ có Liêm Trinh đứng một mình.":S.palace==="Tài Bạch"?"có Phá Quân mang Hóa Lộc.":S.palace==="Phụ Mẫu"?"có Cự Môn mang Hóa Quyền, cạnh Thiên Cơ.":"không có chính tinh nào ngồi."}`:p.trial}</div>${chip}<div class="buy"><span class="price">${fmt(p.price)} Lá</span><button class="cta ${lock?"locked":""}" data-buy="${p.id}" aria-label="Mở ${p.name}, ${fmt(p.price)} Lá${lock?`, cần thêm ${fmt(need)} Lá`:""}">Mở – ${fmt(p.price)} Lá<span class="ar" aria-hidden="true">→</span></button>${lock?`<span class="why">Cần ${fmt(need)} Lá nữa. Bấm để nạp ngay trong tấm.</span>`:""}</div></article>`;
}
function render(){
  $("#bal").textContent="Số dư: "+fmt(S.bal)+" Lá";
  const [h,i]=headText();$("#head").innerHTML=`<span class="eyebrow">Chọn luận giải</span><h1>${h}</h1><p>${i}</p>`;
  const {ids,note}=featured();
  const flagFor=id=>S.arr==="direct"?"":"Hợp với câu bạn vừa hỏi";
  let html=`<section class="sec"><h2>Dành cho bạn lúc này</h2>${note?`<p class="note">${note}</p>`:""}<div class="grid two">${ids.map(id=>cardHTML(byId(id),true,flagFor(id))).join("")}</div></section>`;
  html+=`<section class="sec"><h2>Theo vòng thời gian của bạn</h2><p class="lede">Từ ngày hôm nay đến cả cuộc đời. Phần đã đọc miễn phí ghi ở đầu mỗi tầng.</p>`;
  for(const t of TIERS){
    const items=P.filter(p=>p.tier===t&&avail(p)&&!ids.includes(p.id));
    if(!items.length)continue;
    html+=`<div class="tier"><h3>${t}${FREEDONE[t]?`<small>${FREEDONE[t]}</small>`:""}</h3><div class="grid">${items.map(p=>cardHTML(p,false,"")).join("")}</div></div>`;
  }
  html+=`</section>`;
  html+=`<section class="sec"><h2>So sánh nhanh</h2><div class="tbl"><table><thead><tr><th></th><th>Một cung</th><th>Bản mệnh</th><th>Chặng 10 năm</th><th>Năm</th><th>Trọn đời</th></tr></thead><tbody>
  <tr><td>Gồm</td><td>1 cung, đọc trọn</td><td>Mệnh và Thân</td><td>1 chặng, 10 năm</td><td>12 tháng và cung lưu niên</td><td>12 cung, các chặng, năm hiện tại tóm tắt</td></tr>
  <tr><td>Giá</td><td>120 Lá</td><td>240 Lá</td><td>480 Lá</td><td>480 Lá</td><td>1.200 Lá</td></tr>
  <tr><td>Đã trả được trừ khi nâng lên Trọn đời trong 7 ngày</td><td>Có</td><td>Cần xác nhận với An</td><td>Chưa</td><td>Chưa</td><td>—</td></tr></tbody></table></div></section>`;
  html+=`<section class="sec"><div class="assure">${S.w==="A"?`<p><b>Đọc thử trước khi mở.</b> Mỗi thẻ có đoạn đọc thử từ chính lá số của bạn.</p><p><b>Hoàn Lá nếu thấy không đúng.</b> Đánh dấu "Không đúng" trong 24 giờ: món dưới 500 Lá hoàn đủ, món từ 500 Lá hoàn 50%, mỗi tài khoản một lần.</p>`:`<p><b>Bạn xem thử rồi mới quyết.</b> Đoạn đọc thử trên mỗi thẻ viết từ lá số của bạn, không phải câu chung cho mọi người.</p><p><b>Đọc xong thấy không đúng thì cứ nói.</b> Đánh dấu "Không đúng" trong 24 giờ, Lá Số Việt hoàn lại: món dưới 500 Lá hoàn đủ, món từ 500 Lá hoàn 50%, mỗi tài khoản một lần.</p>`}<p><b>Mua một cung rồi muốn đọc trọn lá số?</b> Phần đã trả được trừ nếu nâng lên Trọn đời trong 7 ngày.</p></div></section>`;
  $("#main").innerHTML=html;
}
function sheet(inner,title){
  $("#layer").innerHTML=`<div class="back" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="top"><h3 id="sh">${title}</h3><button class="x" data-close aria-label="Đóng">✕</button></div>${inner}</div>`;
  document.body.style.overflow="hidden";$(".sheet .x").focus();
}
function close(){$("#layer").innerHTML="";document.body.style.overflow=""}
function confirmSheet(id){
  const p=byId(id);const need=Math.max(0,p.price-S.bal);
  const nm=p.pick?`${p.name} · ${S.palace}`:p.name;
  const learn=`<ul class="learn">${p.learn.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(need===0){
    sheet(`${learn}<div class="sum"><div><span>Giá</span><b>${fmt(p.price)} Lá</b></div><div><span>Số dư hiện tại</span><span>${fmt(S.bal)} Lá</span></div><div class="em"><span>Còn lại sau khi mở</span><span>${fmt(S.bal-p.price)} Lá</span></div></div><button class="cta" id="go" data-go="${id}">Xác nhận mở – ${fmt(p.price)} Lá<span class="ar" aria-hidden="true">→</span></button><p class="final">Một lần bấm, một lần trừ. Bạn có 24 giờ để đánh dấu "Không đúng" nếu muốn hoàn Lá.</p>`,nm);
  }else{
    const pk=PACKS.find(x=>x.la>=need)||PACKS[3];
    sheet(`${learn}<div class="sum"><div><span>Giá</span><b>${fmt(p.price)} Lá</b></div><div><span>Số dư hiện tại</span><span>${fmt(S.bal)} Lá</span></div><div class="em"><span>Cần thêm</span><span>${fmt(need)} Lá</span></div></div><div class="pack"><b>Gói nạp nhỏ nhất đủ dùng: ${pk.n}</b><span>${fmt(pk.la)} Lá, ${pk.vnd}</span><span class="final">Sau khi nạp bạn có ${fmt(S.bal+pk.la)} Lá, mở xong còn ${fmt(S.bal+pk.la-p.price)} Lá.</span></div><button class="cta" id="go" data-topup="${id}|${pk.la}">Nạp ${pk.vnd} và mở<span class="ar" aria-hidden="true">→</span></button><p class="final">Đây là bước cuối trước khi thanh toán. Số tiền đồng chỉ hiện ở đây.</p>`,nm);
  }
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-close]")){close();return}
  const pal=t.closest("[data-pal]");if(pal){e.stopPropagation();if(pal.dataset.pal==="more"){return}S.palace=pal.dataset.pal;render();return}
  const buy=t.closest("[data-buy]");if(buy){e.stopPropagation();confirmSheet(buy.dataset.buy);return}
  const card=t.closest("[data-card]");if(card){confirmSheet(card.dataset.card);return}
  const go=t.closest("[data-go]");if(go){go.classList.add("busy");go.innerHTML='<span class="spin"></span>Đang mở…';setTimeout(()=>{const p=byId(go.dataset.go);S.bal-=p.price;render();sheet(`<div class="ok"><b>Đã mở.</b><span>Bài đọc nằm trong Thư viện của bạn. Còn lại ${fmt(S.bal)} Lá.</span></div><button class="link" data-close>Đóng</button>`,p.name)},900);return}
  const tu=t.closest("[data-topup]");if(tu){const [id,la]=tu.dataset.topup.split("|");tu.classList.add("busy");tu.innerHTML='<span class="spin"></span>Đang nạp…';setTimeout(()=>{S.bal+=+la;render();confirmSheet(id)},900);return}
  const a=t.closest("[data-arr]");if(a){S.arr=a.dataset.arr;$$("[data-arr]").forEach(b=>b.setAttribute("aria-pressed",b===a));render();return}
  const w=t.closest("[data-w]");if(w){S.w=w.dataset.w;$$("[data-w]").forEach(b=>b.setAttribute("aria-pressed",b===w));render();return}
  const b=t.closest("[data-bal]");if(b){S.bal=+b.dataset.bal;$$("[data-bal]").forEach(x=>x.setAttribute("aria-pressed",x===b));render();return}
  const r=t.closest("[data-rel]");if(r){S.rel=r.dataset.rel;$$("[data-rel]").forEach(x=>x.setAttribute("aria-pressed",x===r));render();return}
  if(t.id==="t-auto"||t.id==="t-dark"||t.id==="t-light"){const v=t.id.slice(2);if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",v);["auto","dark","light"].forEach(k=>$("#t-"+k).setAttribute("aria-pressed",k===v))}
});
addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").firstChild)close()});
render();
</script>
